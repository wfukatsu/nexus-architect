name: refresh-okf-k8s-tf

# Weekly refresh of the k8s-tf OKF bundle (knowledge/okf-k8s-tf/) from its public upstream.
# Deterministic — no model, no API key.
#
# 1. Collect — tools/refresh-okf-k8s-tf.py fetches every official page the bundle cites and every
#    release feed in knowledge/okf-k8s-tf-upstream/sources.yaml, and records what moved in
#    state.json + REPORT.md. The two private repositories the observed tier came from are never
#    fetched (this repository is public).
# 2. Apply what needs no judgement — a cited page that redirected gets its frontmatter `resource`
#    rewritten to the final URL (--apply-redirects), noted in the bundle's log.md.
# 3. List what does — the documents awaiting re-verification (a cited page changed, a stated
#    version fell further behind, stale_after passed) go into state.json `pending` and REPORT.md.
#    Revising their prose is judgement: /architect:revise-knowledge, run by a person on demand.
# 4. Propose — one pull request on bot/okf-k8s-tf-refresh, updated in place each week until merged.
#    A quiet week changes nothing and opens nothing.
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    # Every Monday 23:00 JST (= Monday 14:00 UTC). GitHub may start a scheduled run late under load.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-okf-k8s-tf
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the Python dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Collect the public upstream
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}   # raises the GitHub releases API rate limit
        run: |
          python3 tools/refresh-okf-k8s-tf.py --apply-redirects \
            --now="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --github-output="$GITHUB_OUTPUT"
          cat knowledge/okf-k8s-tf-upstream/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the bundle contracts
        run: |
          python3 skills/infra/infra-contract.test.py
          python3 tools/lib/okf_upstream.test.py

      - name: Compose the pull request body
        if: steps.collect.outputs.changed == 'true'
        env:
          PENDING: ${{ steps.collect.outputs.pending }}
        run: |
          {
            echo "Weekly refresh of \`knowledge/okf-k8s-tf/\` from its public upstream (no model involved)."
            echo
            if [ "${PENDING:-0}" -gt 0 ]; then
              echo "**$PENDING document(s) await re-verification.** To revise them, check out this branch, run"
              echo "\`/architect:revise-knowledge\` in Claude Code (it re-collects the page text, which is not"
              echo "committed), and push to this branch."
            else
              echo "No document awaits re-verification."
            fi
            echo
            # REPORT.md without its frontmatter and title
            awk 'NR==1 && /^---$/ {fm=1; next} fm && /^---$/ {fm=0; next} !fm && !/^# /' \
              knowledge/okf-k8s-tf-upstream/REPORT.md
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the pull request
        if: steps.collect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/okf-k8s-tf-refresh
          delete-branch: true
          title: "knowledge(okf-k8s-tf): weekly upstream refresh"
          commit-message: "knowledge(okf-k8s-tf): weekly upstream refresh"
          body-path: ${{ runner.temp }}/pr-body.md
          # Only these paths: the extracted page text under pages/ is git-ignored anyway.
          add-paths: |
            knowledge/okf-k8s-tf/**
            knowledge/okf-k8s-tf-upstream/state.json
            knowledge/okf-k8s-tf-upstream/REPORT.md

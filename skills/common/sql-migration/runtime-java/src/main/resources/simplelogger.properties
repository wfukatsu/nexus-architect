# SLF4J provider of residual-runner (org.slf4j:slf4j-simple). ScalarDB logs through SLF4J; without a provider its
# errors were dropped and every run printed "No SLF4J providers were found" three times.
# Warnings and errors only, on stderr, so that the JSON on stdout stays machine-readable. More detail for one run:
#   RESIDUAL_RUNNER_OPTS=-Dorg.slf4j.simpleLogger.defaultLogLevel=info residual-runner ...
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.levelInBrackets=true
